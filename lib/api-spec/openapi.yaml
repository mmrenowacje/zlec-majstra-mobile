openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Zleć Majstra — platforma łącząca klientów z fachowcami
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Profile and account operations
  - name: requests
    description: Customer job requests
  - name: dashboard
    description: Dashboard summaries
  - name: billing
    description: Contractor subscription access
  - name: admin
    description: Administrator moderation and subscription management
  - name: storage
    description: Persistent image upload and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get current profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateMyProfile
      tags: [profile]
      summary: Save the current user's application profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Authentication required
        "422":
          description: Clerk account has no verified email
  /contractors/{contractorId}/profile:
    get:
      operationId: getContractorProfile
      tags: [profile]
      summary: Get a public contractor profile
      parameters:
        - name: contractorId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Public contractor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorProfile"
        "404":
          description: Contractor not found
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List job requests
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Job requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a job request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequestInput"
      responses:
        "201":
          description: Created job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequest"
  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a job request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequest"
        "404":
          description: Request not found
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a job request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequestUpdate"
      responses:
        "200":
          description: Updated job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequest"
  /requests/{id}/unlock:
    post:
      operationId: unlockRequestContact
      tags: [requests]
      summary: Unlock customer contact details
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Contact access result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAccess"
        "402":
          description: Active contractor subscription required
  /requests/{id}/conversation:
    get:
      operationId: getRequestConversation
      tags: [requests]
      summary: Get a conversation for a request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "403": { description: Conversation access denied }
    post:
      operationId: startRequestConversation
      tags: [requests]
      summary: Start a conversation as an active contractor
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "201":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "402": { description: Active contractor subscription required }
  /requests/{id}/conversation/messages:
    post:
      operationId: sendConversationMessage
      tags: [requests]
      summary: Send a conversation message
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMessageInput" }
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessage" }
  /requests/{id}/conversation/share-contact:
    post:
      operationId: shareRequestContact
      tags: [requests]
      summary: Share customer contact details with the contractor
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
  /requests/{id}/conversations:
    get:
      operationId: listRequestConversations
      tags: [requests]
      summary: List customer conversations for a request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
        "403": { description: Only the request owner can list conversations }
  /requests/{id}/conversations/{conversationId}:
    get:
      operationId: getRequestConversationById
      tags: [requests]
      summary: Get a selected customer conversation
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "403": { description: Conversation access denied }
  /requests/{id}/conversations/{conversationId}/messages:
    post:
      operationId: sendConversationMessageById
      tags: [requests]
      summary: Send a message to a selected customer conversation
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMessageInput" }
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessage" }
  /requests/{id}/conversations/{conversationId}/share-contact:
    post:
      operationId: shareRequestContactById
      tags: [requests]
      summary: Share contact in a selected customer conversation
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
  /notifications:
    get:
      operationId: getNotifications
      tags: [profile]
      summary: Get safe notifications for the current user
      responses:
        "200":
          description: Unread conversation notifications without contact data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSummary"
        "401":
          description: Authentication required
  /requests/{id}/review-candidates:
    get:
      operationId: listReviewCandidates
      tags: [requests]
      summary: List contractors eligible for a review
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Contractors who unlocked contact for the completed request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewCandidate"
        "401":
          description: Authentication required
        "403":
          description: Customer ownership required
        "404":
          description: Request not found
  /requests/{id}/reviews:
    get:
      operationId: listRequestReviews
      tags: [requests]
      summary: List reviews for a request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Reviews visible to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
        "401":
          description: Authentication required
        "403":
          description: Access to this request's reviews is not allowed
        "404":
          description: Request not found
    post:
      operationId: createRequestReview
      tags: [requests]
      summary: Add a review for a contractor
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid review
        "401":
          description: Authentication required
        "403":
          description: Review eligibility requirements are not met
        "409":
          description: Review already exists
  /requests/{id}/reviews/{reviewId}/reply:
    post:
      operationId: createReviewReply
      tags: [requests]
      summary: Reply to a contractor review
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewReplyInput"
      responses:
        "201":
          description: Review reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid reply
        "401":
          description: Authentication required
        "403":
          description: Only the reviewed contractor can reply
        "404":
          description: Review not found
  /requests/{id}/reviews/{reviewId}/photos:
    post:
      operationId: addProjectPhoto
      tags: [requests]
      summary: Add a completed project photo to a reviewed contractor
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPhotoInput"
      responses:
        "201":
          description: Project photo added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPhoto"
        "403":
          description: Only the reviewed contractor may add photos
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored image
          content:
            image/*:
              schema: { type: string, format: binary }
        "409":
          description: Reply already exists
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /billing/subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get contractor subscription status
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    post:
      operationId: startSubscription
      tags: [billing]
      summary: Start PayU checkout for the contractor subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: PayU checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckout"
  /billing/payments/{extOrderId}:
    get:
      operationId: getPaymentStatus
      tags: [billing]
      summary: Get the current user's PayU payment status
      parameters:
        - name: extOrderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          description: Payment not found
  /billing/payu/notifications:
    post:
      operationId: receivePayuNotification
      tags: [billing]
      summary: Receive a signed PayU order status notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayuNotificationInput"
      responses:
        "204":
          description: Notification accepted
        "400":
          description: Invalid notification
        "401":
          description: Invalid signature
  /site/settings:
    get:
      operationId: getSiteSettings
      tags: [marketplace]
      summary: Get public platform settings
      responses:
        "200":
          description: Public platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /chatbot/messages:
    post:
      operationId: sendChatbotMessage
      tags: [marketplace]
      summary: Send a message to the configured support chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotMessageInput"
      responses:
        "200":
          description: Chatbot reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotReply"
        "400":
          description: Invalid message
        "404":
          description: Chatbot is disabled
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get platform-wide statistics for administrators
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get editable platform and chatbot settings
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update platform and chatbot settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "400":
          description: Invalid settings
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/subscriptions:
    get:
      operationId: listAdminSubscriptions
      tags: [admin]
      summary: List contractor subscription requests for administrators
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, active, inactive, canceled, all]
            default: pending
      responses:
        "200":
          description: Contractor subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSubscription"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List customer and contractor accounts for administrators
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [customer, contractor, all]
            default: all
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/users/{profileId}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Block or unblock a user account
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid action or protected account
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: User not found
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a customer or contractor account
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account deleted
        "400":
          description: Protected account cannot be deleted
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: User not found
  /admin/requests:
    get:
      operationId: listAdminRequests
      tags: [admin]
      summary: List job requests for administrators
      responses:
        "200":
          description: Job requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRequest"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/requests/{id}:
    patch:
      operationId: updateAdminRequest
      tags: [admin]
      summary: Block or unblock a job request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRequestUpdate"
      responses:
        "200":
          description: Updated job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRequest"
        "400":
          description: Invalid action
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Job request not found
    delete:
      operationId: deleteAdminRequest
      tags: [admin]
      summary: Delete a job request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: Job request deleted
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Job request not found
  /admin/subscriptions/{profileId}:
    get:
      operationId: listAdminSubscriptionHistory
      tags: [admin]
      summary: List subscription status changes for administrators
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription status history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSubscriptionStatusHistory"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Contractor subscription not found
    patch:
      operationId: updateAdminSubscription
      tags: [admin]
      summary: Change a contractor subscription status
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSubscriptionUpdate"
      responses:
        "200":
          description: Updated contractor subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscription"
        "400":
          description: Invalid status
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Contractor subscription not found
components:
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: integer
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required: [id, role, firstName, lastName, email, phone, verified, companyName, companyAddress, nip, profileImageUrl]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [customer, contractor, admin]
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        companyName: { type: ["string", "null"] }
        companyAddress: { type: ["string", "null"] }
        serviceLocation: { type: ["string", "null"] }
        nip: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
        verified: { type: boolean }
        isBlocked: { type: boolean }
        blockedAt: { type: ["string", "null"], format: date-time }
        blockedReason: { type: ["string", "null"] }
    ProfileInput:
      type: object
      required: [role, firstName, lastName, phone]
      properties:
        role:
          type: string
          enum: [customer, contractor]
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 7 }
        companyName: { type: ["string", "null"], minLength: 2 }
        companyAddress: { type: ["string", "null"], minLength: 3 }
        serviceLocation: { type: ["string", "null"], minLength: 2 }
        nip: { type: ["string", "null"], pattern: "^[0-9]{10}$" }
    ContractorProfile:
      type: object
      required: [id, firstName, lastName, companyName, companyAddress, serviceLocation, nip, profileImageUrl, verified, averageRating, reviewCount, completedProjects]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        companyName: { type: ["string", "null"] }
        companyAddress: { type: ["string", "null"] }
        serviceLocation: { type: ["string", "null"] }
        nip: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
        verified: { type: boolean }
        averageRating: { type: number, minimum: 0, maximum: 5 }
        reviewCount: { type: integer, minimum: 0 }
        completedProjects:
          type: array
          items: { $ref: "#/components/schemas/ProjectPhoto" }
    JobRequest:
      type: object
      required: [id, customerName, title, description, category, location, address, budget, status, createdAt, contactAvailable]
      properties:
        id: { type: integer }
        customerName: { type: string }
        title: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [hydraulik, elektryk, malarz, stolarz, plytkarz, brukarz, dekarz, wykonczenia, zlota-raczka, inne, remont, budowa, hydraulika, elektryka]
        location: { type: string }
        address: { type: ["string", "null"] }
        budget: { type: string }
        status:
          type: string
          enum: [open, in_progress, completed]
        createdAt: { type: string, format: date-time }
        photos:
          type: array
          items: { type: string }
        contactAvailable: { type: boolean }
        customerEmail: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
    JobRequestInput:
      type: object
      required: [title, description, category, location, address, budget]
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string, minLength: 10 }
        category:
          type: string
